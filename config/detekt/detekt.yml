# Overrides on top of detekt's default config, for Compose conventions.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

style:
  MagicNumber:
    # UI code is full of design values (dp, colors, animation timings); game logic stays strict.
    excludes: ['**/ui/**', '**/test/**', '**/androidTest/**']
