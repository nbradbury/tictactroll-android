# Overrides on top of detekt's default config, for Compose conventions.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  PackageNaming:
    # Allows the underscores in the app's com.nbradbury.tic_tac_troll package.
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

style:
  MagicNumber:
    # UI code is full of design values (dp, colors, animation timings); game logic stays strict.
    excludes: ['**/ui/**', '**/test/**', '**/androidTest/**']
